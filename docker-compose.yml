services:
  backend:
    image: ghcr.io/thesct22/ezyshare-backend:latest
    build:
      context: ./backend
      target: prod
    container_name: ezyshare_backend
    restart: unless-stopped
    environment:
      - APP_ENV=dev
      - PORT=8080
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:8080,https://sharath.is-a.dev
      # - TURN_SERVER_URL=turn:your-turn-server.com:3478
      # - TURN_SECRET=your_turn_secret
    ports:
      - "8080:8080"
    networks:
      - ezyshare_network

  frontend:
    image: ghcr.io/thesct22/ezyshare-frontend:latest
    build:
      context: ./frontend
      target: prod
    container_name: ezyshare_frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - ezyshare_network

networks:
  ezyshare_network:
    driver: bridge
