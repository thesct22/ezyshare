repos:
  # 1. General & YAML Hygiene Hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  # 2. YAML & JSON Formatting (Prettier)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]

  # 3. Go Backend Quality Hooks
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-vet
      - id: go-test

  # 4. Frontend Local Hooks (Linting, Typecheck & Vitest)
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend Oxlint
        entry: bash -c "cd frontend && npm run lint"
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-typecheck
        name: Frontend TypeScript Check
        entry: bash -c "cd frontend && npm run typecheck"
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-test
        name: Frontend Vitest Unit Tests
        entry: bash -c "cd frontend && npm test"
        language: system
        files: ^frontend/
        pass_filenames: false
