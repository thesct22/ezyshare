repos:
  # 1. General & YAML Hygiene Hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  # 2. Local Project Hooks (Prettier, Go Backend & React Frontend)
  - repo: local
    hooks:
      - id: prettier-check
        name: Prettier YAML & Markdown Format Check
        entry: npx --yes prettier --check "**/*.{yml,yaml,json,md}"
        language: system
        pass_filenames: false

      - id: backend-fmt
        name: Backend Go Format Check
        entry: bash -c "cd backend && unformatted=$(gofmt -s -l .) && if [ -n \"$unformatted\" ]; then echo \"Unformatted files:\n$unformatted\"; exit 1; fi"
        language: system
        files: ^backend/
        pass_filenames: false

      - id: backend-vet
        name: Backend Go Vet
        entry: bash -c "cd backend && go vet ./..."
        language: system
        files: ^backend/
        pass_filenames: false

      - id: backend-test
        name: Backend Go Unit Tests
        entry: bash -c "cd backend && go test ./..."
        language: system
        files: ^backend/
        pass_filenames: false

      - id: frontend-lint
        name: Frontend Oxlint
        entry: bash -c "cd frontend && npm run lint"
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-typecheck
        name: Frontend TypeScript Check
        entry: bash -c "cd frontend && npm run typecheck"
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-test
        name: Frontend Vitest Unit Tests
        entry: bash -c "cd frontend && npm test"
        language: system
        files: ^frontend/
        pass_filenames: false
