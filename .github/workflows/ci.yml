name: CI - Code Quality, Testing & Linting

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend (Lint, Typecheck & Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Oxlint
        run: |
          cd frontend
          npm run lint

      - name: Run Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run Vitest Unit & Component Tests
        run: |
          cd frontend
          npm test

  backend-ci:
    name: Backend (Go Formatting, Vet & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "backend/go.mod"
          cache-dependency-path: "backend/go.sum"

      - name: Check Go Formatting
        run: |
          cd backend
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted properly:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go Vet
        run: |
          cd backend
          go vet ./...

      - name: Run Go Test Suite
        run: |
          cd backend
          go test -v ./...

  yaml-and-formatting-ci:
    name: YAML & Repository Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js for Prettier
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check Formatting with Prettier
        run: |
          npx prettier --check "**/*.{yml,yaml,json,md}"
