name: Deploy Frontend to gh-pages Branch

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Static Site
        env:
          VITE_WS_URL: "wss://ezyshare-backend-375411068753.us-central1.run.app/ws"
          VITE_API_URL: "https://ezyshare-backend-375411068753.us-central1.run.app"
        run: |
          cd frontend
          npm run build

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          # If you have a custom domain, uncomment the line below and set your domain:
          # cname: ezyshare.yourdomain.com
